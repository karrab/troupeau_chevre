; =====================================================================
;  Réglages PHP recommandés en production (php.ini ou conf.d/99-troupeau.ini)
; =====================================================================

; ---- OPcache : cache du bytecode PHP compilé -------------------------
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
; En production : ne pas vérifier les dates des fichiers (vider OPcache après chaque déploiement
; via Paramètres > Système & cache, ou en redémarrant PHP-FPM)
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.save_comments=1
; JIT (PHP 8+)
opcache.jit=tracing
opcache.jit_buffer_size=64M
; Préchargement des classes de l'application (PHP-FPM / mod_php, chemin absolu à adapter)
;opcache.preload=/var/www/troupeau/config/preload.php
;opcache.preload_user=www-data

; ---- APCu : cache applicatif en mémoire partagée ---------------------
extension=apcu
apc.enabled=1
apc.shm_size=64M
apc.ttl=0
apc.entries_hint=4096
apc.enable_cli=0

; ---- Divers ----------------------------------------------------------
realpath_cache_size=4096K
realpath_cache_ttl=600
memory_limit=256M
max_execution_time=120
session.use_strict_mode=1
session.cookie_httponly=1
expose_php=Off
